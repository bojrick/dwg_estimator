# ==============================================================================
# Plan Vault PWA - Nginx Reverse Proxy & Static Asset Configuration
# ==============================================================================
# Domain: YOUR_DOMAIN (e.g., plans.yourdomain.com or yourdomain.com)
# Replace 'YOUR_DOMAIN' with your actual domain name.
# ==============================================================================

# Backend connection pool
upstream planvault_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zones (protect against brute force & DoS)
limit_req_zone $binary_remote_addr zone=pv_auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pv_api_limit:10m rate=40r/s;

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Automated Let's Encrypt ACME Challenge & HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt validation root
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all remaining HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Hardened, Optimized Production Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Document root for React/Vite production build
    root /opt/dwg_estimator/frontend/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # SSL/TLS Hardening (A+ Rating Configuration)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Protocols: Modern TLS only (Disable insecure SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # SSL Session Caching for low-latency handshakes
    ssl_session_timeout 1d;
    ssl_session_cache shared:PlanVaultSSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Fast certificate validation)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Policies & Headers
    # --------------------------------------------------------------------------
    server_tokens off;
    include /opt/dwg_estimator/deploy/nginx/security-headers.conf;

    # Support large DWG/DXF and PDF drawing uploads (up to 250MB)
    client_max_body_size 250M;
    client_body_timeout 120s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 120s;

    # --------------------------------------------------------------------------
    # Compression (Gzip) for Fast Initial Loads
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/dxf;

    # --------------------------------------------------------------------------
    # Frontend Static Caching Rules (PWA & Vite)
    # --------------------------------------------------------------------------
    # 1. Hashed JS/CSS chunks: Immutable caching for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. PWA Service Worker & Manifest: Never cache to guarantee instant updates
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Attack Surface Hardening (Block dotfiles, git, env, databases)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|py|pyc|db|sqlite|log|sh|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Backend API Proxying
    # --------------------------------------------------------------------------
    # Rate limit sensitive authentication endpoints against brute force
    location /api/auth/ {
        limit_req zone=pv_auth_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://planvault_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # General API proxy (plans upload, parsing, sheet extraction, export)
    location /api/ {
        limit_req zone=pv_api_limit burst=20 nodelay;

        proxy_pass http://planvault_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for heavy multi-sheet CAD parsing & PDF rendering
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Upstream proxy buffers
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    # Swagger / OpenAPI documentation endpoints
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://planvault_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Single Page Application (SPA) Client-Side Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        # HTML document is revalidated on reload to pick up new chunk hashes
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

