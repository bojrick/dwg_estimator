# Security headers for Plan Vault PWA
# Include inside server or location blocks

# Prevent clickjacking: allow framing only from the same origin (required for embedded CAD viewer)
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Modern referrer policy: full URL for same-origin, domain-only for cross-origin HTTPS
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict unwanted browser features / sensors
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# HTTP Strict Transport Security (HSTS) - enforce HTTPS for 1 year
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

