# ==============================================================================
# Plan Vault PWA - Initial HTTP Bootstrap Configuration
# ==============================================================================
# Use this configuration BEFORE running Certbot, so Nginx starts without SSL errors.
# Replace 'YOUR_DOMAIN' with your actual domain name.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Serve placeholder or proxy until SSL is obtained
    location / {
        root /opt/dwg_estimator/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}

